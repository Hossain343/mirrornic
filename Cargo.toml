[package]
name = "mirrornic"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.29"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
futures = "0.3"
socket2 = { version = "0.5", features = ["all"] }
netstack-smoltcp = "0.2"
wintun = "0.5"
windows-sys = { version = "0.59", features = ["Win32_Networking_WinSock", "Win32_NetworkManagement_IpHelper"] }

[build-dependencies]
embed-resource = "2.5"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
