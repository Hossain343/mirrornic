name: build-windows
on:
  push:
  workflow_dispatch:
jobs:
  win:
    runs-on: windows-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Get wintun.dll
        shell: pwsh
        run: |
          Invoke-WebRequest https://www.wintun.net/builds/wintun-0.14.1.zip -OutFile wintun.zip
          Expand-Archive wintun.zip -DestinationPath wt
          New-Item -ItemType Directory -Force assets | Out-Null
          Copy-Item wt/wintun/bin/amd64/wintun.dll assets/wintun.dll
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          cargo build --release 2>&1 | tee build.log
      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
      - name: Publish build errors as check-run
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          touch build.log
          TEXT=$(tail -c 60000 build.log)
          jq -n --arg t "$TEXT" --arg sha "$GITHUB_SHA" \
            '{name:"build-errors", head_sha:$sha, status:"completed", conclusion:"failure",
              output:{title:"cargo build failed", summary:"compiler output (tail,60KB)", text:$t}}' > check.json
          gh api --method POST "repos/$GITHUB_REPOSITORY/check-runs" --input check.json
      - uses: actions/upload-artifact@v4
        with:
          name: mirrornic
          path: target/release/mirrornic.exe
