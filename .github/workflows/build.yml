name: build-windows
on:
  push:
  workflow_dispatch:
jobs:
  win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Get wintun.dll
        shell: pwsh
        run: |
          Invoke-WebRequest https://www.wintun.net/builds/wintun-0.14.1.zip -OutFile wintun.zip
          Expand-Archive wintun.zip -DestinationPath wt
          New-Item -ItemType Directory -Force assets | Out-Null
          Copy-Item wt/wintun/bin/amd64/wintun.dll assets/wintun.dll
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          cargo build --release 2>&1 | tee build.log
      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
      - uses: actions/upload-artifact@v4
        with:
          name: mirrornic
          path: target/release/mirrornic.exe
